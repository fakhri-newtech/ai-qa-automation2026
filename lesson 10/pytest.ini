# ==========================================
# FILE: pytest.ini (Must be in the project root folder)
# ==========================================
[pytest]
addopts = --headed --tracing=retain-on-failure --screenshot=only-on-failure

# ==========================================
# 🧠 INSTRUCTOR NOTES: Code Breakdown & New Keywords
# (Explain these concepts immediately after typing)
# ==========================================
# 1. File Name (`pytest.ini`):
#    Clarify to the students: It must be exactly `pytest.ini`. Not `python.ini`, 
#    and not inside a subfolder. Pytest automatically searches the root folder 
#    for this specific file before running any tests.
#
# 2. `[pytest]`:
#    This is a section header. It tells the configuration reader that the 
#    settings below it belong strictly to Pytest.
#
# 3. `addopts` (Add Options):
#    This is the magic keyword. It means: "Every time I click the VS Code 
#    play button, or type `pytest` in the terminal, secretly ADD THESE OPTIONS 
#    to the command."
#
# 4. The Flags Breakdown:
#    - `--headed`: Forces the browser UI to open. (Fixes the VS Code trap!)
#    - `--tracing=retain-on-failure`: Builds a full trace zip file ONLY if 
#      the test crashes. Keeps our hard drive clean.
#    - `--screenshot=only-on-failure`: Takes a screenshot exactly when an 
#      `expect` fails.
#
# 5. INSTRUCTOR DEMO (Crucial Step):
#    Now, go back to the `test_cart_fixture.py` file from Slide 8.
#    Intentionally BREAK the test (e.g., change the locator to ".wrong_cart_link").
#    Click the VS Code green play button. 
#    Show the students how:
#       1. The browser actually opens (because of `--headed`).
#       2. The test fails safely.
#       3. A "test-results" folder magically appears containing the screenshot 
#          and trace—with ZERO manual try/finally blocks in our Python code!