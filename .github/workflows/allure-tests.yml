name: Run Allure Tests & Deploy Report

on:
  push:
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright deepeval allure-pytest openai
          playwright install

      - name: Run Tests Across All Lesson Folders
        run: |
          mkdir -p allure-results
          for lesson in lesson*/; do
            if [ -d "${lesson}tests" ]; then
              echo "Running tests in ${lesson}tests"
              pytest "${lesson}tests" --alluredir=allure-results || true
            fi
          done

      - name: Get Allure history & Generate Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 20

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages