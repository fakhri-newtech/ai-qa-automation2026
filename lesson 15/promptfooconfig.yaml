description: "Latency Evaluation under 30000ms"
providers:
  - id: ollama:chat:phi3
    config:
      temperature: 0
      apiBaseUrl: 'http://localhost:11434'
defaultTest:
  options:
    provider: ollama:chat:phi3
prompts:
  - "You are a customer service assistant. User says: {{user_input}}"
tests:
  - vars:
      user_input: "How much does a junior qa automation engineer make a month?"
    assert:
      - type: latency
        threshold: 30000
  - vars:
      user_input: "Explain why QA automation is important."
    assert:
      - type: latency
        threshold: 30000